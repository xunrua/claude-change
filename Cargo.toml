[package]
name = "claude-profile"
version = "0.1.0"
edition = "2024"
description = "CLI/TUI tool for managing Claude Code configuration profiles"
authors = ["Claude Profile Contributors"]
license = "MIT"
repository = "https://github.com/xunrua/claude-change"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
url = "2"
thiserror = "2"
anyhow = "1"
chrono = "0.4"
fs4 = { version = "0.12", features = ["sync"] }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = ["tui"]
tui = ["ratatui", "crossterm"]
http-validate = ["reqwest", "tokio"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
